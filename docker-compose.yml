services:
  # MongoDB - Base de données pour FIWARE
  mongo:
    image: mongo:4.4
    platform: linux/amd64
    hostname: mongo
    container_name: det-mongo
    ports:
      - "27017:27017"
    networks:
      - fiware
    volumes:
      - mongo-db:/data/db

  # Orion Context Broker - Le coeur du Digital Twin
  orion:
    image: fiware/orion-ld:1.5.1
    platform: linux/amd64
    hostname: orion
    container_name: det-orion
    depends_on:
      - mongo
    networks:
      - fiware
    ports:
      - "1026:1026"
    command: -dbhost mongo -logLevel DEBUG

networks:
  fiware:
    driver: bridge

volumes:
  mongo-db:
